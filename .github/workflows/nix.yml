name: "nix CI"
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    branches: [develop]
jobs:
  amd64:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --print-build-logs
  arm64:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --print-build-logs
